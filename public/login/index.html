<!doctype html>
<html lang="zh-Hant" data-theme-id="theme-7" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>LOC · 登入</title>
<link rel="stylesheet" href="/login/appearance.css">

</head>
<body>
<div class="login-shell">
  <header class="topbar">
    <a class="brand" href="/" aria-label="返回 LOC 月典首頁"><span class="brand-mark" aria-hidden="true">◐</span><span class="brand-copy"><strong>LOC</strong><small>月典</small></span></a>
    <a class="back-link" href="/">繼續瀏覽 <span aria-hidden="true">↗</span></a>
  </header>
  <main class="auth-scene">
    <section class="intro" aria-labelledby="welcome">
      <span class="eyebrow">LANGUAGE · TIME · TRACE</span>
      <h1 id="welcome">回到你的<br><em>文字世界。</em></h1>
      <p class="lead">讓作品、時間與空間重新相遇。登入後，接續你的創作與個人設定。</p>
      <div class="orbit" aria-hidden="true"><span class="orbit-ring"></span><span class="orbit-ring"></span><span class="orbit-ring"></span><span class="orbit-core">◐</span><span class="orbit-dot"></span></div>
      <p class="intro-note">閱讀公開內容，不需要登入。</p>
    </section>
    <section class="auth-surface" aria-label="LOC 登入與身分核驗">
      <div class="auth-top"><span class="eyebrow">YOUR ACCOUNT</span><p>安全登入，繼續原本的工作。</p></div>
      <div id="login-root">
        <p class="native-note">透過 LOC Auth SSO 登入；需要外部身分驗證時由 LOC Auth 處理。</p>
      </div>
      <div id="signed-in" hidden>
        <h2>身分核驗</h2>
        <p id="user"></p>
        <p>登入後會確認你的帳戶身分；管理與寫入權限仍由 LOC 獨立檢查。</p>
        <div class="actions">
          <button id="return" type="button" disabled>核驗後返回 LOC</button>
          <button id="copy-loc-subject" type="button" disabled>複製 LOC ID</button>
          <button id="signout" type="button">登出</button>
        </div>
      </div>
      <p id="status" role="status" aria-live="polite">載入登入介面…</p>
    </section>
  </main>
  <footer class="footer"><span>LOC · 月典</span><span>登入只確認身分，管理權限仍須另行驗證。</span></footer>
</div>
<script type="module">
const byId=id=>document.getElementById(id);
const AUTH='https://auth.lo3rwang.cc';
const RETURN_KEY='loc-management-login-return-v1';
let verifiedUser=null;
function returnPath(){
 const value=new URLSearchParams(location.search).get('return_to')||'/local/settings/';
 if(!value.startsWith('/')||value.startsWith('//')||value.includes('\\'))
  return '/local/settings/';
 const url=new URL(value,location.origin);
 return url.origin===location.origin?url.pathname+url.search:'/local/settings/';
}
function returnToLoc(){
 if(!verifiedUser)return;
 const path=returnPath();
 if(/\/(?:manage|admin)(?:\/|$)/.test(path)){
  try{sessionStorage.setItem(RETURN_KEY,path)}catch{}
 }
 location.assign(path);
}
function login(){location.assign(AUTH+'/login?return_to='+encodeURIComponent(returnPath()))}
const panel=byId('login-root');
const sso=document.createElement('button');
sso.type='button';sso.id='loc-sso-login';sso.className='loc-login-choice';
sso.textContent='使用 LOC Auth SSO';
sso.onclick=async()=>{if(!await refresh())login();else returnToLoc()};
panel.appendChild(sso);
byId('return').onclick=returnToLoc;
byId('copy-loc-subject').onclick=async()=>{
 if(!verifiedUser)return;
 try{
  await navigator.clipboard.writeText(verifiedUser.id);
  byId('status').textContent='LOC ID 已複製';
 }catch{byId('status').textContent=verifiedUser.id}
};
byId('signout').onclick=async()=>{
 try{
  const res=await fetch(AUTH+'/api/auth/sign-out',{
   method:'POST',credentials:'include',
   headers:{'content-type':'application/json'},body:'{}'
  });
  if(!res.ok)throw Error('LOC 登出失敗');
  location.reload();
 }catch(error){byId('status').textContent=String(error.message||error)}
};
async function refresh(){
 const res=await fetch(AUTH+'/api/auth/get-session',{
  credentials:'include',cache:'no-store',headers:{accept:'application/json'}
 });
 if(!res.ok)throw Error('LOC SSO 暫時無法取得登入狀態');
 const data=await res.json();
 const user=data?.user;
 verifiedUser=data?.session&&user?.emailVerified===true&&
   typeof user?.id==='string'&&user.id?user:null;
 panel.hidden=Boolean(verifiedUser);
 byId('signed-in').hidden=!verifiedUser;
 byId('return').disabled=!verifiedUser;
 byId('copy-loc-subject').disabled=!verifiedUser;
 byId('user').textContent=verifiedUser?.email||'';
 byId('status').textContent=verifiedUser?
  'LOC 身分已核驗，編輯權限由網站資料服務檢查。':
  '閱讀公開資料不需要登入。';
 return Boolean(verifiedUser);
}
// Cloudflare redirects here after Better Auth finishes its OIDC callback.
// Confirm the server-side Session before returning to Settings; a redirect
// alone is never proof that sign-in succeeded.
const oauthReturn=new URLSearchParams(location.search).get('oauth_return')==='1';
refresh().then(signedIn=>{
 if(!oauthReturn)return;
 if(signedIn){returnToLoc();return;}
 byId('status').textContent='Cloudflare 已返回 LOC，但尚未取得有效的 LOC Auth Session。請重新登入；若持續發生，請檢查 Auth 回呼及 Cookie。';
}).catch(error=>{
 byId('status').textContent='LOC Auth Session 核驗失敗：'+String(error.message||error);
 panel.hidden=false;
});
</script>
</body>
</html>
