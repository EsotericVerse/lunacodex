<!doctype html>
<html lang="zh-Hant" data-theme-id="theme-7" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>LOC · 登入</title>
<link rel="stylesheet" href="/login/appearance.css">

</head>
<body>
<div class="login-shell">
  <header class="topbar">
    <a class="brand" href="/" aria-label="返回 LOC 月典首頁"><span class="brand-mark" aria-hidden="true">◐</span><span class="brand-copy"><strong>LOC</strong><small>月典</small></span></a>
    <a class="back-link" href="/">繼續瀏覽 <span aria-hidden="true">↗</span></a>
  </header>
  <main class="auth-scene">
    <section class="intro" aria-labelledby="welcome">
      <span class="eyebrow">LANGUAGE · TIME · TRACE</span>
      <h1 id="welcome">回到你的<br><em>文字世界。</em></h1>
      <p class="lead">讓作品、時間與空間重新相遇。登入後，接續你的創作與個人設定。</p>
      <div class="orbit" aria-hidden="true"><span class="orbit-ring"></span><span class="orbit-ring"></span><span class="orbit-ring"></span><span class="orbit-core">◐</span><span class="orbit-dot"></span></div>
      <p class="intro-note">閱讀公開內容，不需要登入。</p>
    </section>
    <section class="auth-surface" aria-label="LOC 登入與身分核驗">
      <div class="auth-top"><span class="eyebrow">YOUR ACCOUNT</span><p>安全登入，繼續原本的工作。</p></div>
      <div id="login-root">
        <form id="loc-native-form" autocomplete="on">
          <div class="loc-native-choice" role="group" aria-label="LOC 登入或註冊">
            <button type="button" id="native-login-toggle" aria-pressed="true">LOC 登入</button>
            <button type="button" id="native-signup-toggle" aria-pressed="false">註冊 LOC 帳號</button>
          </div>
          <label id="native-name-field" hidden>顯示名稱
            <input id="native-name" name="name" autocomplete="name" maxlength="100">
          </label>
          <label>電子郵件
            <input id="native-email" type="email" name="email" autocomplete="email" required maxlength="250">
          </label>
          <label>密碼
            <input id="native-password" type="password" name="password" autocomplete="current-password"
              required minlength="12" maxlength="128">
          </label>
          <button type="submit" class="loc-login-choice" id="native-submit">登入 LOC</button>
          <p class="native-note">LOC 是獨立帳號，不需要 GitHub 或其他服務。註冊後如需管理權限，仍須完成信箱驗證及 LOC 授權。</p>
        </form>
        <p class="native-divider">或參照外部身分登入</p>
      </div>
      <div id="signed-in" hidden>
        <h2>身分核驗</h2>
        <p id="user"></p>
        <p>登入後會確認你的帳戶身分；管理與寫入權限仍由 LOC 獨立檢查。</p>
        <div class="actions">
          <button id="return" type="button" disabled>核驗後返回 LOC</button>
          <button id="signout" type="button">登出</button>
        </div>
      </div>
      <p id="status" role="status" aria-live="polite">載入登入介面…</p>
    </section>
  </main>
  <footer class="footer"><span>LOC · 月典</span><span>登入只確認身分，管理權限仍須另行驗證。</span></footer>
</div>
<script type="module">
const byId=id=>document.getElementById(id);
const AUTHORITY='https://auth.lo3rwang.cc';
const LOGIN_RETURN_KEY='loc-management-login-return-v1';
let verifiedForEditor=false;
function validReturnPath(){
 const value=new URLSearchParams(location.search).get('return_to')||'/local/settings/';
 if(!value.startsWith('/')||value.startsWith('//')||value.includes('\\'))
  return '/local/settings/';
 const parsed=new URL(value,location.origin);
 return parsed.origin===location.origin?parsed.pathname+parsed.search+parsed.hash:'/local/settings/';
}
function isProtectedReturn(path){
 return /\/(?:manage|admin)(?:\/|$)/.test(new URL(path,location.origin).pathname);
}
function oauthContinuation(){
 const value=new URLSearchParams(location.search).get('continue');
 if(!value||!value.startsWith('/oauth/authorize?')||value.includes('\\'))return '';
 const url=new URL(value,AUTHORITY);
 return url.origin===AUTHORITY&&url.pathname==='/oauth/authorize'&&!url.hash
   ?url.pathname+url.search:'';
}
function signIn(provider){
 const url=new URL('/oauth/login',AUTHORITY);
 url.searchParams.set('provider',provider);
 const continued=oauthContinuation();
 if(continued)url.searchParams.set('continue',continued);
 else url.searchParams.set('return_to',validReturnPath());
 location.assign(url.href);
}
const panel=byId('login-root');
let signup=false,submitting=false;
function setNativeMode(next){
 signup=next;
 byId('native-login-toggle').setAttribute('aria-pressed',String(!next));
 byId('native-signup-toggle').setAttribute('aria-pressed',String(next));
 byId('native-name-field').hidden=!next;
 byId('native-name').required=next;
 byId('native-password').autocomplete=next?'new-password':'current-password';
 byId('native-submit').textContent=next?'建立 LOC 帳號':'登入 LOC';
}
byId('native-login-toggle').addEventListener('click',()=>setNativeMode(false));
byId('native-signup-toggle').addEventListener('click',()=>setNativeMode(true));
byId('loc-native-form').addEventListener('submit',async event=>{
 event.preventDefault();
 if(submitting)return;
 submitting=true;byId('native-submit').disabled=true;
 byId('status').textContent=signup?'正在建立 LOC 帳號…':'正在核驗 LOC 帳號…';
 try{
  const email=byId('native-email').value.trim().toLowerCase();
  const password=byId('native-password').value;
  const body=signup?{name:byId('native-name').value.trim(),email,password}:
   {email,password};
  const endpoint=signup?'/api/auth/sign-up/email':'/api/auth/sign-in/email';
  const reply=await fetch(AUTHORITY+endpoint,{
   method:'POST',credentials:'include',cache:'no-store',
   headers:{'content-type':'application/json','accept':'application/json'},
   body:JSON.stringify(body)
  });
  if(!reply.ok)throw Error('LOC 帳號驗證失敗（HTTP '+reply.status+'）。請確認資料或改用其他已授權方式。');
  await initialize();
  const continued=oauthContinuation();
  if(continued){location.assign(AUTHORITY+continued);return;}
  if(signup)byId('status').textContent='LOC 帳號已建立；管理與寫入權限仍須信箱驗證及 LOC 授權。';
 }catch(error){byId('status').textContent=String(error.message||error)}
 finally{submitting=false;byId('native-submit').disabled=false}
});
for(const [provider,text] of [['oidc','使用 Google 繼續'],['github','使用 GitHub 繼續']]){
 const button=document.createElement('button');
 button.type='button';button.className='loc-login-choice';
 button.textContent=text;
 button.addEventListener('click',()=>signIn(provider));
 panel.appendChild(button);
}
byId('return').addEventListener('click',()=>{
 if(!verifiedForEditor)return;
 const path=validReturnPath();
 if(isProtectedReturn(path)){
  try{sessionStorage.setItem(LOGIN_RETURN_KEY,path);}catch{}
 }
 const continued=oauthContinuation();
 location.assign(continued?AUTHORITY+continued:path);
});
byId('signout').addEventListener('click',async()=>{
 try{
  const response=await fetch(AUTHORITY+'/oauth/logout',{
   method:'POST',credentials:'include',cache:'no-store'
  });
  if(!response.ok)throw new Error('LOC Auth 登出失敗');
  location.reload();
 }catch(error){byId('status').textContent=String(error.message||error);}
});
async function initialize(){
 const response=await fetch(AUTHORITY+'/v1/auth/session',{
  method:'GET',credentials:'include',cache:'no-store',
  headers:{accept:'application/json'}
 });
 if(!response.ok)throw new Error('LOC Auth 暫時無法確認登入狀態（HTTP '+response.status+'）');
 const data=await response.json();
 const user=data?.user;
 const signedIn=Boolean(data?.provider==='loc'&&/^loc_[A-Za-z0-9_-]{32,80}$/.test(
  String(user?.id||''))&&/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(String(user?.email||''))&&
  typeof data?.session?.access_token==='string');
 const choose=new URLSearchParams(location.search).get('force_choose')==='1';
 verifiedForEditor=signedIn;
 panel.hidden=signedIn&&!choose;
 byId('signed-in').hidden=!signedIn;
 byId('return').disabled=!signedIn;
 byId('user').textContent=signedIn?user.email:'';
 byId('status').textContent=signedIn
  ?(isProtectedReturn(validReturnPath())
   ?'LOC Auth 身分已核驗，返回後將確認編輯權限。'
   :'LOC Auth 身分已核驗，管理與寫入權限由 LOC 獨立確認。')
  :'可使用 LOC 原生帳號，或自行選擇外部身分核驗。公開閱讀不需要登入。';
}
initialize().catch(error=>{byId('status').textContent=String(error.message||error);});
</script>
</body>
</html>
