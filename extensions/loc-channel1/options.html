<!doctype html>
<html lang="zh-Hant"><head><meta charset="UTF-8"><title>LOC 網頁短匯入</title><style>
body{font:15px system-ui;max-width:620px;margin:40px auto;padding:0 20px;line-height:1.65}
button{padding:10px 18px;margin-right:8px}#status{margin-top:16px}
</style></head><body>
<h1>LOC 網頁短匯入</h1>
<p>使用 LOC 自有 OAuth。首次按「連接 LOC」完成一次授權，之後會自動沿用有效憑證；不經 Clerk、KV 或 GitHub 登入。</p>
<button id="connect">連接 LOC</button><button id="disconnect">解除連線</button>
<p id="status" role="status"></p>
<p>連線後，在網頁按右鍵選擇「LOC：解析並儲存此頁」。尚未送出的資料保存在本機佇列。</p>
<script src="options.js"></script></body></html>
