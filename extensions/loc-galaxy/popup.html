<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="script-src 'self'; object-src 'none';">
<title>LOC Galaxy</title>
<link rel="stylesheet" href="popup.css">
<script type="module" src="popup.mjs"></script>
</head>
<body>
<main class="shell">
  <header class="brand"><img class="brand-icon" src="icons/loc-favicon.png" alt="" width="28" height="28"><span>LOC <small>GALAXY</small></span></header>
  <div class="eyebrow">LANGUAGE · TIME · TRACE</div>
  <h1>回到你的<br><em>文字世界。</em></h1>
  <p class="intro">只連線 LOC MCP。先選擇 Scope，再使用 Clerk OAuth 驗證。</p>
  <form id="connect" autocomplete="off">
    <label for="scopeid">Scope ID</label>
    <input id="scopeid" name="scopeid" required maxlength="15" pattern="[a-z][a-z0-9]{0,14}" placeholder="例如 lo3rwang" spellcheck="false" autocapitalize="none" autocomplete="off">
    <div class="actions">
      <button id="login" type="button" class="primary">1 · 開啟 LOC 登入畫面</button>
      <button id="authorize" type="button">2 · 驗證 OAuth 並連線</button>
    </div>
  </form>
  <section id="connected" hidden>
    <span class="connected-mark">●</span> <strong>LOC MCP 已授權</strong>
    <p id="account"></p>
    <button type="button" id="disconnect" class="quiet">中斷 Extension 連線</button>
  </section>
  <p id="status" role="status" aria-live="polite">正在檢查連線狀態…</p>
  <footer>憑證不傳給其他 MCP 或網頁。<br>OAuth 未通過 Scope 寫入授權前，不啟用其他功能。</footer>
</main>
</body></html>
