<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LOC galaxy-link｜設定</title>
<style>
:root{font:15px/1.65 system-ui;color-scheme:light dark}
body{max-width:560px;margin:36px auto;padding:0 22px}
h1{font-size:23px;margin:0 0 10px}
h2{font-size:17px;margin:20px 0 8px}
button{cursor:pointer;border:1px solid #8b929e;border-radius:7px;padding:9px 13px;background:transparent;color:inherit;margin:4px 6px 4px 0}
button:focus-visible,input:focus-visible{outline:2px solid #3983e5;outline-offset:2px}
label{display:block;margin:10px 0}
input[type=text]{display:block;max-width:400px;width:100%;box-sizing:border-box;padding:9px;border:1px solid #8b929e;border-radius:6px;background:transparent;color:inherit}
small{display:block;color:gray}
#status,#queue,#notice{white-space:pre-wrap;overflow-wrap:anywhere}
</style>
</head>
<body>
<h1>LOC galaxy-link｜彩虹橋</h1>
<p>所有擷取與錄製操作都在<strong>網頁右鍵 → LOC 彩虹橋｜galaxy-link</strong> 子選單執行。點擊擴充功能圖示只開啟此設定頁，不會彈出擷取面板。</p>
<h2>LOC Auth</h2>
<button id="connect">連接 LOC Auth</button>
<button id="disconnect">解除連線</button>
<div id="status" role="status"></div>
<h2>擷取偏好</h2>
<label for="scope">目的 Scope ID（加入 Queue 時固定，不會事後改目的地）</label>
<input type="text" id="scope" value="lo3rwang" pattern="[a-z][a-z0-9]{0,14}" maxlength="15" autocomplete="off" spellcheck="false">
<label><input type="checkbox" id="includeAI"> 擷取已載入的對話時也保存 AI 回覆</label>
<small>預設只擷取使用者文字。Chrome 只可擷取當前已載入的對話內容。</small>
<div id="notice" role="status"></div>
<h2>離線 Queue</h2>
<p id="queue" role="status"></p>
<button id="flush">手動送出 Queue</button>
<small>所有擷取功能共用單一 Queue。滿十次擷取或達批次大小才自動送出；只有 LOC 回傳完整文章 UID 才清除已確認的紀錄。</small>
<script src="options.js"></script>
</body>
</html>
