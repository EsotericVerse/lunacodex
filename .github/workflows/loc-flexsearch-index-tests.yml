name: LOC FlexSearch index regression

# Manual only: the owner controls independent Cloudflare Worker deployment.
on:
  workflow_dispatch:
    inputs:
      deploy_worker:
        description: 'Deploy private LOC Search Index Worker after tests (no SQL cutover)'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: loc-search-index-worker
  cancel-in-progress: false

jobs:
  index-tests:
    name: FlexSearch tests, bundle validation and optional Worker deployment
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install repo-locked dependencies without installation hooks
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify index, federation and bounded backfill
        run: |
          node --test \
            scripts/test-loc-search-index.mjs \
            scripts/test-loc-federated-galaxy-search.mjs \
            scripts/test-loc-search-index-stage.mjs
      - name: Validate Worker bundling without deployment
        run: ./node_modules/.bin/wrangler deploy --dry-run --config workers/loc-search-index/wrangler.jsonc --outdir /tmp/loc-search-index-bundle
      - name: Verify manual deployment ref and server-only secrets
        if: ${{ inputs.deploy_worker }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          LOC_SEARCH_INDEX_SECRET: ${{ secrets.LOC_SEARCH_INDEX_SECRET }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main" || { echo "::error::Deploy only from main"; exit 1; }
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Missing CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::Missing CLOUDFLARE_ACCOUNT_ID"; exit 1; }
          test "${#LOC_SEARCH_INDEX_SECRET}" -ge 32 || { echo "::error::Missing/short LOC_SEARCH_INDEX_SECRET"; exit 1; }
      - name: Deploy independent loc-search-index Worker (SQL cutover remains disabled)
        if: ${{ inputs.deploy_worker && github.ref == 'refs/heads/main' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: ./node_modules/.bin/wrangler deploy --config workers/loc-search-index/wrangler.jsonc
      - name: Install private index service secret
        if: ${{ inputs.deploy_worker && github.ref == 'refs/heads/main' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          LOC_SEARCH_INDEX_SECRET: ${{ secrets.LOC_SEARCH_INDEX_SECRET }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$LOC_SEARCH_INDEX_SECRET" | ./node_modules/.bin/wrangler secret put LOC_SEARCH_INDEX_SECRET --config workers/loc-search-index/wrangler.jsonc
