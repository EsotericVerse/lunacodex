name: Syntax evidence
on:
  pull_request:
  push:
    branches:
      - 'fix/unified-manage-rpc-20261103'
permissions:
  contents: read
jobs:
  syntax:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - run: npm run check:syntax
