name: Next Architecture Build

# Cost control: expensive full app build is manual only.
# Run from Actions when doing a deliberate release or architecture verification.
on:
  workflow_dispatch:

concurrency:
  group: next-architecture-main
  cancel-in-progress: true

jobs:
  build-next-architecture:
    # Pinned, not ubuntu-latest: every run since 2026-10-20 07:20 UTC has
    # failed - almost all at "Run browser accessibility checks" with the
    # Playwright webServer never answering - regardless of what the commit
    # actually changed. ubuntu-latest's own notice on these runs says it is
    # migrating to Ubuntu 26 starting the same week, so this pins the
    # known-good image while that migration rolls out.
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.5"
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Security audit (moderate, high and critical)
        run: npm run audit:security
      - name: Build Next.js app (legacy ISR retired)
        # shell: bash enables pipefail; without it `| tee` hides a failed build.
        shell: bash
        run: npm run build 2>&1 | tee /tmp/next-build.log
      - name: Verify retired ISR and published JS snapshots
        run: node scripts/verify-release-no-isr.mjs
      - name: Report build failure to job summary
        if: failure()
        run: |
          echo '## Build failure output' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          if [ -f /tmp/next-build.log ]; then
            tail -n 200 /tmp/next-build.log >> "$GITHUB_STEP_SUMMARY"
            # Log annotations are useful when the build actually ran.
            tail -n 8 /tmp/next-build.log | cut -c1-400 | while IFS= read -r line; do
              echo "::error title=build-tail::${line//%/%25}"
            done
          else
            echo 'Build was not started. See the earlier failed step.' >> "$GITHUB_STEP_SUMMARY"
          fi
          echo '```' >> "$GITHUB_STEP_SUMMARY"
