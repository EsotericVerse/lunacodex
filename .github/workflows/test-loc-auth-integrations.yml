name: Verify LOC Auth and website boundaries
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
      - name: Install exact Better Auth dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify Better Auth code and permissions
        run: |
          npm run test:authority
          node --check workers/loc-authority/auth.mjs
          node --check workers/loc-authority/index.mjs
          node --check app/loc/mcp/native-kysely.mjs
          node --check app/loc/mcp/native-operations.mjs
      - name: Validate Cloudflare Worker configuration without deployment
        run: npx --yes wrangler@4.157.0 deploy --config workers/loc-authority/wrangler.jsonc --dry-run --outdir /tmp/loc-check
