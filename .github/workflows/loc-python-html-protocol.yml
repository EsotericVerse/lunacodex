name: LOC Python + JavaScript HTML Protocol
on:
  pull_request:
    paths:
      - 'modules/loc/python/**'
      - 'scripts/build-loc-static.mjs'
      - 'tests/test_loc_python_html.py'
      - '.github/workflows/loc-python-html-protocol.yml'
  push:
    branches: [main]
    paths:
      - 'modules/loc/python/**'
      - 'scripts/build-loc-static.mjs'
      - 'tests/test_loc_python_html.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  static-html:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify Python static HTML protocol
        run: python -m unittest discover -s tests -p 'test_loc_python_html.py' -v
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.5'
          cache: npm
      - name: Install LOC build packages
        run: npm ci
      - name: Build all existing LOC routes with React and Python
        run: npm run build:static
      - name: Confirm public static pages and browser bundles
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const report=JSON.parse(fs.readFileSync('out/_loc/build-report.json','utf8'));
          assert.ok(report.routes>=60,'LOC route regression');
          for(const path of ['out/index.html','out/culture/index.html',
            'out/statics/index.html','out/trace/index.html',
            'out/search/index.html','out/lo3rwang/index.html','out/lrunes/index.html']){
            const html=fs.readFileSync(path,'utf8');
            assert.match(html,/<html lang="zh-Hant">/);
            assert.match(html,/<link rel="stylesheet" href="/);
          }
          assert.match(fs.readFileSync('out/index.html','utf8'),/loc-static-reading/);
          NODE
