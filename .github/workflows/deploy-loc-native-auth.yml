name: Deploy LOC native OAuth (without Clerk or SQL Gateway)
# A change to this workflow deploys LOC Auth once; routine LOC changes do not.
# Manual releases remain available without consuming quota on every push.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-loc-native-auth.yml'

permissions:
  contents: read

concurrency:
  group: loc-native-oauth
  cancel-in-progress: true

jobs:
  native-oauth:
    runs-on: ubuntu-24.04
    env:
      CLOUDFLARE_ACCOUNT_ID: f730f29a620a25bb047a69d542457fc0
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
      - name: Verify local OAuth and Scope contracts
        run: |
          node --check workers/loc-authority/index.mjs
          node --check workers/loc-authority/native-oauth.mjs
          node --test scripts/test-loc-native-oauth.mjs scripts/test-loc-authority-native-only.mjs scripts/test-loc-no-vendor-auth-runtime.mjs
      - name: Build native OAuth Worker (no SQL Gateway)
        run: npx --yes wrangler@4.157.0 deploy --config workers/loc-authority/wrangler.jsonc --dry-run --outdir /tmp/loc-native-auth-check
      - name: Explain missing deployment authorization
        if: ${{ env.CLOUDFLARE_API_TOKEN == '' }}
        run: |
          echo "::warning title=LOC Auth not deployed::GitHub repository secret CLOUDFLARE_API_TOKEN is missing. Build validated, but auth.lo3rwang.cc remains offline."
          echo "## Native LOC Auth deployment blocked" >> "$GITHUB_STEP_SUMMARY"
          echo "Set repository secret CLOUDFLARE_API_TOKEN with Workers Scripts Edit and zone Workers Routes/Domains permissions; rerun this workflow." >> "$GITHUB_STEP_SUMMARY"
      - name: Deploy native OAuth and custom domain
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        run: npx --yes wrangler@4.157.0 deploy --config workers/loc-authority/wrangler.jsonc
      - name: Verify live OAuth discovery, JWKS and session boundary
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        run: node scripts/probe-loc-native-auth.mjs
