name: Deploy LOC native Auth (OAuth only, no SQL Gateway)
# Release 2026-11-09: use existing Supabase Google OAuth for invited LOC owner; keep registration closed.
# A change to this workflow deploys LOC Auth once; routine LOC changes do not.
# Manual releases remain available without consuming quota on every push.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-loc-native-auth.yml'

permissions:
  contents: read

concurrency:
  group: loc-native-oauth
  cancel-in-progress: true

jobs:
  native-oauth:
    runs-on: ubuntu-24.04
    env:
      CLOUDFLARE_ACCOUNT_ID: f730f29a620a25bb047a69d542457fc0
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
      - name: Require deployment authorization before consuming build minutes
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error title=LOC Auth release blocked::Missing GitHub Actions repository secret CLOUDFLARE_API_TOKEN. Existing Cloudflare Worker has NOT been updated."
            echo "## LOC Auth release blocked: deployment credential missing" >> "$GITHUB_STEP_SUMMARY"
            echo "Set CLOUDFLARE_API_TOKEN with Workers Scripts Edit and required zone route permissions; rerun this job. Do not create another Worker." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      - name: Install exact test dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify LOC first-party credentials, Auth Ref, Scope, and mapped SQL contracts
        run: |
          node --check workers/loc-authority/index.mjs
          node --check workers/loc-authority/native-oauth.mjs
          node --check workers/loc-authority/auth-ref.mjs
          npm run test:authority
          node --test scripts/test-loc-auth-qos.mjs scripts/test-loc-auth-store.mjs
          npm run check:loc-vendor-coupling
      - name: Build native OAuth Worker (no SQL Gateway)
        run: npx --yes wrangler@4.157.0 deploy --config workers/loc-authority/wrangler.jsonc --dry-run --outdir /tmp/loc-native-auth-check
      - name: Deploy native OAuth and custom domain
        run: npx --yes wrangler@4.157.0 deploy --config workers/loc-authority/wrangler.jsonc
      - name: Verify live OAuth discovery, JWKS and session boundary
        run: node scripts/probe-loc-native-auth.mjs
