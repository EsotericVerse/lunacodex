name: Workflow guard

# Minimal, one run per feature-branch push. No pull_request event to duplicate the check.
# Cloudflare Pages is the sole automatic website deployer.
on:
  push:
    branches-ignore:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: workflow-guard-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  guard:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Sparse blobless checkout (only needed sources)
        shell: bash
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          git init -q .
          git remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          git sparse-checkout init --no-cone
          if [ -n "$PR_NUMBER" ]; then
            git sparse-checkout set \
              '/.github/workflows/**' \
              '/scripts/check-workflow-triggers.rb'
            ref="refs/pull/$PR_NUMBER/merge"
          else
            git sparse-checkout set \
              '/.github/workflows/**' '/app/**' '/scripts/**' '/functions/**' '/packages/**' '/modules/**' '/package.json' '/next.config.mjs' '/public/sw.js'
            ref="$GITHUB_SHA"
          fi
          git -c protocol.version=2 fetch --quiet --depth=1 --filter=blob:none origin "$ref"
          git checkout --quiet --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Verify LOC-only workflow triggers (parsed YAML)
        run: |
          ruby scripts/check-workflow-triggers.rb
      - name: Install syntax parser for LOC check
        shell: bash
        run: |
          npm install --prefix "$RUNNER_TEMP/loc-syntax" --no-save --no-package-lock --ignore-scripts --no-audit --no-fund '@babel/parser@7.29.9'
      - name: Verify LOC JavaScript and JSX syntax
        shell: bash
        run: |
          NODE_PATH="$RUNNER_TEMP/loc-syntax/node_modules" node scripts/check-js-syntax.mjs
