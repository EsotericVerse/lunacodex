name: Workflow guard

# Strictly manual. No automatic PR, push, merge, or scheduled runs.
# This check is opt-in only; do not email the owner on each workflow edit.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: workflow-guard-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  guard:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Sparse blobless checkout (only needed sources)
        shell: bash
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          git init -q .
          git remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          git sparse-checkout init --no-cone
          if [ -n "$PR_NUMBER" ]; then
            git sparse-checkout set \
              '/.github/workflows/**' \
              '/scripts/check-workflow-triggers.rb' \
              '/scripts/test-workflow-triggers.rb'
            ref="refs/pull/$PR_NUMBER/merge"
          else
            git sparse-checkout set \
              '/.github/workflows/**' '/app/**' '/scripts/**' \
              '/package.json' '/package-lock.json' '/next.config.mjs' \
              '/public/sw.js'
            ref="$GITHUB_SHA"
          fi
          git -c protocol.version=2 fetch --quiet --depth=1 --filter=blob:none origin "$ref"
          git checkout --quiet --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Reject unauthorized workflow triggers (parsed YAML)
        run: |
          ruby scripts/check-workflow-triggers.rb
          ruby scripts/test-workflow-triggers.rb
      - name: Install pinned syntax parser (manual recovery only)
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          npm install --prefix "$RUNNER_TEMP/loc-syntax" --no-save --no-package-lock --ignore-scripts --no-audit --no-fund '@babel/parser@7.29.9'
      - name: Verify application syntax (manual recovery only)
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          NODE_PATH="$RUNNER_TEMP/loc-syntax/node_modules" node scripts/check-js-syntax.mjs
