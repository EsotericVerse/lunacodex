name: Workflow guard

# The only pre-authorized auto-triggered workflow in this repo (see AGENTS.md
# section 11). It installs no dependencies and runs in seconds, so it adds no
# meaningful billing risk. Its sole purpose is to catch, at PR time, any other
# workflow file that has been given an auto-trigger (push / pull_request /
# schedule / etc.) without the owner's explicit approval, since every other
# workflow in this repo is required to be workflow_dispatch-only to avoid
# uncontrolled CI/CD spend.
on:
  pull_request:
    paths:
      - '.github/workflows/**'

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4

      - name: Only workflow_dispatch is allowed outside this guard
        shell: bash
        run: |
          set -euo pipefail
          # Any of these keys appearing as a top-level trigger (2-space
          # indented, directly under `on:`) in another workflow file means
          # that workflow can run without explicit, per-run human approval.
          forbidden='^[[:space:]]{2}(push|pull_request|pull_request_target|schedule|workflow_run|repository_dispatch|issues|issue_comment|workflow_call|check_run|check_suite|create|delete|release|discussion|discussion_comment):'

          fail=0
          shopt -s nullglob
          for f in .github/workflows/*.yml .github/workflows/*.yaml; do
            base="$(basename "$f")"
            if [ "$base" = "workflow-guard.yml" ]; then
              continue
            fi
            if grep -En "$forbidden" "$f" > /tmp/guard-hit.txt; then
              echo "::error file=$f::Disallowed auto-trigger(s) found. Only 'workflow_dispatch' is pre-approved (AGENTS.md section 11)."
              cat /tmp/guard-hit.txt
              fail=1
            fi
          done

          if [ "$fail" -ne 0 ]; then
            echo ""
            echo "One or more workflow files declare an auto-trigger without explicit owner approval."
            echo "If this is intentional, get the owner's explicit sign-off first, then add the file to this guard's allowlist."
            exit 1
          fi

          echo "OK: every workflow file other than this guard uses workflow_dispatch only."
