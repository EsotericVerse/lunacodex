name: Workflow guard

# Lightweight, one run per feature-branch push. No pull_request event to duplicate the check.
# Cloudflare Pages is the sole automatic website deployer.
on:
  push:
    branches-ignore:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: workflow-guard-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  guard:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Sparse blobless checkout (only needed sources)
        shell: bash
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          git init -q .
          git remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          git sparse-checkout init --no-cone
          if [ -n "$PR_NUMBER" ]; then
            git sparse-checkout set \
              '/.github/workflows/**' \
              '/scripts/check-workflow-triggers.rb'
            ref="refs/pull/$PR_NUMBER/merge"
          else
            git sparse-checkout set \
              '/.github/workflows/**' '/app/**' '/scripts/**' \
              '/functions/api/las-native.js' '/functions/api/loc-native.js' '/config/lrs-source.json' '/packages/zenstack/**' '/package.json' '/package-lock.json' '/next.config.mjs' \
              '/public/sw.js' '/public/_routes.json'
            ref="$GITHUB_SHA"
          fi
          git -c protocol.version=2 fetch --quiet --depth=1 --filter=blob:none origin "$ref"
          git checkout --quiet --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Reject unauthorized workflow triggers (parsed YAML)
        run: |
          ruby scripts/check-workflow-triggers.rb
      - name: Install pinned syntax parser (manual recovery only)
        shell: bash
        run: |
          npm install --prefix "$RUNNER_TEMP/loc-syntax" --no-save --no-package-lock --ignore-scripts --no-audit --no-fund '@babel/parser@7.29.9'
      - name: Verify application syntax (manual recovery only)
        shell: bash
        run: |
          NODE_PATH="$RUNNER_TEMP/loc-syntax/node_modules" node scripts/check-js-syntax.mjs
      - name: Verify LOC scoped cache, SW, and resource lifecycle
        run: |
          node --test \
            scripts/test-query-snapshot-store.mjs \
            scripts/test-scoped-zmodel-cache.mjs \
            scripts/test-public-bootstrap-lifecycle.mjs \
            scripts/test-sw-zmodel-integration.mjs \
            scripts/test-page-resource-boundary.mjs \
            scripts/test-loc-rfc9110-browser-session.mjs \
            scripts/test-loc-browser-route-session.mjs \
            scripts/test-loc-direct-api-session-policy.mjs \
            scripts/test-loc-direct-request-lifecycle.mjs
      - name: Verify LRS Web links, local IPA assets and fail-closed version plan
        run: node --test scripts/test-lrs-web-assets.mjs scripts/test-ipa-workflow-metadata.mjs scripts/test-lrs-deployment-plan.mjs scripts/test-lrs-emergency-authorization.mjs scripts/test-lrs-emergency-live.mjs
      - name: Verify ordered MCP conversations without database writes
        run: node --check app/loc/mcp/conversations.mjs && node --check app/loc/mcp/native-operations.mjs && node --test scripts/test-mcp-ordered-conversation.mjs
      - name: Verify independent LAS Auth and LOC Pages deployment boundary
        run: node --test scripts/test-las-deployment-boundary.mjs scripts/test-las-deploy-authorization.mjs
      - name: One-off public HTTP smoke (branch only, remove before merge)
        shell: bash
        run: |
          set -uo pipefail
          urls=(
            'https://loc.lo3rwang.cc/'
            'https://loc.lo3rwang.cc/api/loc-public-content?kind=config&scope=lo3rwang'
            'https://loc.lo3rwang.cc/api/loc-public-content?kind=block_list&scope=lo3rwang'
            'https://loc.lo3rwang.cc/api/loc-permissions'
          )
          for url in "${urls[@]}"; do
            echo "::group::Live LOC GET: ${url}"
            code=$(curl --noproxy '*' --silent --show-error --max-time 18 --max-filesize 2500000 \
              -H 'Accept: application/json' -H 'Cache-Control: no-cache' \
              -D /tmp/loc-live-headers -o /tmp/loc-live-body \
              -w '%{http_code}' "${url}") || code="curl-error"
            echo "HTTP_STATUS=${code}"
            grep -iE '^(HTTP/|cache-control:|content-type:|location:|cf-ray:)' /tmp/loc-live-headers | head -n 12 || true
            head -c 240 /tmp/loc-live-body || true
            echo; echo "::endgroup::"
          done
