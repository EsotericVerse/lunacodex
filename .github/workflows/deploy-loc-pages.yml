name: Deploy LOC Pages from GitHub

# Manual main-only fallback when the Pages Git integration queues but does not build.
# No push, PR, merge, schedule or preview deployment triggers.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: loc-pages-manual-production
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.ref == 'refs/heads/main' }}
    name: Build and publish LOC main
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CLOUDFLARE_ACCOUNT_ID: f730f29a620a25bb047a69d542457fc0
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CI: "true"
    steps:
      - name: Check out exact main commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Setup pinned Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.23.5'
          cache: npm
      - name: Verify existing GitHub Cloudflare credential
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN}" ]; then
            echo "::error::GitHub secret CLOUDFLARE_API_TOKEN is not configured"
            exit 1
          fi
          echo "GitHub Cloudflare credential is present; value not printed."
      - name: Install pinned dependencies
        run: npm ci --no-audit --no-fund
      - name: Build static LOC export
        run: npm run build:static
      - name: Require Settings routes and homepage in export
        shell: bash
        run: |
          set -euo pipefail
          test -s out/index.html
          test -s out/settings/index.html
          test -s out/local/settings/index.html
      - name: Deploy this main commit to LOC Pages production
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4.157.0 pages deploy out \
            --project-name loc \
            --branch main \
            --commit-hash "$GITHUB_SHA"
      - name: Report deployed source
        if: success()
        shell: bash
        run: |
          echo "LOC Pages production deployed from GitHub main at $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
