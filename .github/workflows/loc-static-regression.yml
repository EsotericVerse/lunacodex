name: LOC Static HTML Regression

on:
  pull_request:
    paths:
      - 'scripts/build-loc-static.mjs'
      - 'scripts/verify-loc-output.mjs'
      - 'app/loc/runtime/html-entry.jsx'
      - 'tests/loc-html-base.test.mjs'
      - '.github/workflows/loc-static-regression.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/build-loc-static.mjs'
      - 'scripts/verify-loc-output.mjs'
      - 'app/loc/runtime/html-entry.jsx'
      - 'tests/loc-html-base.test.mjs'
      - '.github/workflows/loc-static-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-html:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.5'
          cache: npm
      - name: Install existing build packages
        run: npm ci --no-audit --no-fund
      - name: Verify minimal HTML entry contract
        run: node --test tests/loc-html-base.test.mjs
      - name: Build existing static HTML routes
        run: npm run build:static
      - name: Verify static content and browser bundles
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const report=JSON.parse(fs.readFileSync('out/_loc/build-report.json','utf8'));
          assert.ok(report.routes>=60,'LOC route regression');
          for(const path of ['out/index.html','out/culture/index.html',
            'out/statics/index.html','out/trace/index.html',
            'out/search/index.html','out/lo3rwang/index.html','out/lrunes/index.html']){
            const html=fs.readFileSync(path,'utf8');
            assert.match(html,/<html lang="zh-Hant">/);
            assert.match(html,/<link rel="stylesheet" href="/);
          }
          assert.match(fs.readFileSync('out/index.html','utf8'),/loc-static-reading/);
          NODE
