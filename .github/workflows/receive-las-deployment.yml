name: LOC receive published LAS contract

# LAS may notify LOC only AFTER its own Cloudflare Workers production check.
# The requester cannot grant itself LOC deployment authority.
on:
  repository_dispatch:
    types:
      - loc-las-published

permissions:
  contents: write
  checks: read

concurrency:
  group: loc-las-published-receipts
  cancel-in-progress: false

jobs:
  loc-las-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.5'
      - name: Validate signed LAS release; notify LOC Pages only once per deployed LAS version
        id: verify
        env:
          LOC_LAS_NOTIFICATION: ${{ toJSON(github.event.client_payload) }}
          LOC_LAS_SENDER_ID: ${{ github.event.sender.id }}
          LOC_LAS_SENDER_LOGIN: ${{ github.event.sender.login }}
          GH_TOKEN: ${{ github.token }}
          LOC_PAGES_DEPLOY_HOOK: ${{ secrets.LOC_PAGES_DEPLOY_HOOK }}
        run: node scripts/receive-las-deployment.mjs
