name: Deploy LOC Auth (Better Auth)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: auth-deploy
  cancel-in-progress: true
jobs:
  auth:
    runs-on: ubuntu-24.04
    env:
      CLOUDFLARE_ACCOUNT_ID: f730f29a620a25bb047a69d542457fc0
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
      - name: Check Cloudflare release permissions
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Missing Cloudflare Worker deployment credential"
            exit 1
          fi
      - name: Install locked Auth dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify Better Auth source and checks
        run: |
          npm run test:authority
          node --check workers/loc-authority/index.mjs
          node --check workers/loc-authority/auth.mjs
      - name: Validate Worker without publishing
        run: npx --yes wrangler@4.157.0 deploy --config workers/loc-authority/wrangler.jsonc --dry-run --outdir /tmp/auth-check
      - name: Reject deployment without independent LOC Auth PostgreSQL binding
        # Metadata-only Cloudflare check. Never print or connect using the secret.
        run: |
          npx --yes wrangler@4.157.0 secret list --config workers/loc-authority/wrangler.jsonc --format json > /tmp/loc-auth-secret-names.json
          node -e "const fs=require('node:fs');const entries=JSON.parse(fs.readFileSync('/tmp/loc-auth-secret-names.json','utf8'));if(!Array.isArray(entries)||!entries.some(s=>s.name==='LOC_AUTH_DATABASE_URL')){console.error('LOC Auth PostgreSQL secret is missing; deployment refused without touching the Worker.');process.exit(1)}"
      - name: Deploy canonical LOC Auth domain
        run: npx --yes wrangler@4.157.0 deploy --config workers/loc-authority/wrangler.jsonc
      - name: Verify issuer metadata (no credentials used)
        run: |
          curl -fsS https://auth.lo3rwang.cc/.well-known/openid-configuration > /tmp/loc-oidc.json
          node -e "const j=require('/tmp/loc-oidc.json');if(!j.issuer||!j.authorization_endpoint||!j.jwks_uri)process.exit(1)"
