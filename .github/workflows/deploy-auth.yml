name: Deploy auth
# Deploy the existing auth Worker (auth.lo3rwang.cc); never create a duplicate.
# Better Auth handles Google OAuth; this workflow is manual, separate from Cloudflare Builds.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: auth-deploy
  cancel-in-progress: true

jobs:
  auth:
    runs-on: ubuntu-24.04
    env:
      CLOUDFLARE_ACCOUNT_ID: f730f29a620a25bb047a69d542457fc0
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
      - name: Require deployment authorization before consuming build minutes
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error title=auth release blocked::Missing GitHub Actions repository secret CLOUDFLARE_API_TOKEN. Existing Cloudflare Worker has NOT been updated."
            echo "## auth release blocked: deployment credential missing" >> "$GITHUB_STEP_SUMMARY"
            echo "Set CLOUDFLARE_API_TOKEN with Workers Scripts Edit and required zone route permissions; rerun this job. Do not create another Worker." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      - name: Install exact test dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify auth credentials, Auth Ref, Scope, and mapped SQL contracts
        run: |
          node --check workers/loc-authority/index.mjs
          node --check workers/loc-authority/native-oauth.mjs
          node --check workers/loc-authority/auth-ref.mjs
          npm run test:authority
          node --test scripts/test-loc-auth-qos.mjs scripts/test-loc-auth-store.mjs
          npm run check:loc-vendor-coupling
      - name: Validate auth Worker deployment (dry run)
        run: npx --yes wrangler@4.157.0 deploy --config workers/loc-authority/wrangler.jsonc --dry-run --outdir /tmp/auth-check
      - name: Deploy auth at auth.lo3rwang.cc
        run: npx --yes wrangler@4.157.0 deploy --config workers/loc-authority/wrangler.jsonc
      - name: Verify auth discovery, JWKS and session boundary
        run: node scripts/probe-loc-native-auth.mjs
