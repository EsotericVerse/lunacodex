name: LOC galaxy-link v2 (manual read-only checks)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: galaxy-link-v2-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
          cache: npm
      - name: Install frozen dependencies (no site build or deployment)
        run: npm ci --no-audit --no-fund
      - name: Check JS and React syntax
        run: npm run check:syntax
      - name: Run galaxy-link v2 and existing short-import contract tests
        run: |
          node --test \
            scripts/test-loc-web-capture-v2.mjs \
            scripts/test-loc-short-append-service.mjs \
            scripts/test-loc-short-edge-authorization.mjs
