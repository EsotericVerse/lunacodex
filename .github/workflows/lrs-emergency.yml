name: LOC LRS Emergency (verified, expiring)
# Triggered only from the existing authenticated Cloudflare -> GitHub path.
# Never from merge, push, normal release, schedule or LRS Workers Builds.
on:
  repository_dispatch:
    types:
      - loc-lrs-emergency

permissions:
  contents: read

concurrency:
  group: loc-lrs-emergency
  cancel-in-progress: false

jobs:
  emergency-lrs:
    if: ${{ github.event_name == 'repository_dispatch' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: loc-source
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: EsotericVerse/lunarunes
          ref: main
          fetch-depth: 0
          path: rune-source
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.5'
      - name: Verify HMAC and explicit emergency TTL (no token refresh)
        id: gate
        env:
          LOC_LRS_EMERGENCY_REQUEST: ${{ toJSON(github.event.client_payload) }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          LOC_EMERGENCY_MAX_TTL_SECONDS: ${{ vars.LOC_EMERGENCY_MAX_TTL_SECONDS }}
        run: node loc-source/scripts/verify-lrs-emergency.mjs
      - name: Checkout exact intended LRS revision on existing main
        env:
          LRS_TARGET_SHA: ${{ steps.gate.outputs.target_sha }}
        run: |
          set -euo pipefail
          git -C rune-source cat-file -e "${LRS_TARGET_SHA}^{commit}"
          git -C rune-source merge-base --is-ancestor "$LRS_TARGET_SHA" origin/main
          git -C rune-source checkout --detach "$LRS_TARGET_SHA"
          test "$(git -C rune-source rev-parse HEAD)" = "$LRS_TARGET_SHA"
      - name: Verify real advisory and current existing LRS Worker deployment
        env:
          LOC_LRS_EMERGENCY_REQUEST: ${{ toJSON(github.event.client_payload) }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          LOC_EMERGENCY_MAX_TTL_SECONDS: ${{ vars.LOC_EMERGENCY_MAX_TTL_SECONDS }}
          CLOUDFLARE_ACCOUNT_ID: 'f730f29a620a25bb047a69d542457fc0'
        run: node loc-source/scripts/attest-lrs-emergency.mjs before
      - name: Build only the pinned LRS artifacts, not LOC nor IPA
        run: |
          npm --prefix rune-source install --no-audit --no-fund
          npm --prefix rune-source run build:cloudflare
          npm --prefix rune-source run check:cloudflare:release
      - name: Recheck TTL, advisory and deployed Worker before one-time release
        env:
          LOC_LRS_EMERGENCY_REQUEST: ${{ toJSON(github.event.client_payload) }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          LOC_EMERGENCY_MAX_TTL_SECONDS: ${{ vars.LOC_EMERGENCY_MAX_TTL_SECONDS }}
          CLOUDFLARE_ACCOUNT_ID: 'f730f29a620a25bb047a69d542457fc0'
        run: node loc-source/scripts/attest-lrs-emergency.mjs before
      - name: Release existing LRS Worker (no Grant, no Worker Builds)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 'f730f29a620a25bb047a69d542457fc0'
          LRS_RELEASE_SHA: ${{ steps.gate.outputs.target_sha }}
          LRS_RELEASE_APPROVED: '1'
        run: |
          set -euo pipefail
          cd rune-source
          test "$(git rev-parse HEAD)" = "$LRS_RELEASE_SHA"
          node scripts/deploy-rune-cloudflare.mjs
      - name: Verify Worker version changed without touching LOC production
        env:
          LOC_LRS_EMERGENCY_REQUEST: ${{ toJSON(github.event.client_payload) }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          LOC_EMERGENCY_MAX_TTL_SECONDS: ${{ vars.LOC_EMERGENCY_MAX_TTL_SECONDS }}
          CLOUDFLARE_ACCOUNT_ID: 'f730f29a620a25bb047a69d542457fc0'
        run: node loc-source/scripts/attest-lrs-emergency.mjs after
