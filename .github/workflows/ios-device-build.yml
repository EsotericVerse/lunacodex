name: LOC iOS Device Unsigned IPA
run-name: LOC IPA · ${{ github.ref_name }} · ${{ github.sha }}

# LOC-only, manual IPA build. LRS has its own native delivery pipeline.
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Attach unsigned IPA to the matching current RC prerelease (optional)'
        required: false
        type: string

permissions:
  contents: write

# Keep only the newest main build when several app commits land together.
concurrency:
  group: loc-ios-device-main
  cancel-in-progress: true

jobs:
  # Cheap, fast, deterministic gate on a normal Linux runner: catches an
  # obviously broken commit before any minute is spent on the much more
  # expensive macOS runner below. It validates syntax once without
  # repeating standalone regression test suites. If this guard passes,
  # the native build proceeds; it never blocks on anything other than a
  # real syntax break, so it can't get stuck or loop.
  guard:
    if: ${{ github.ref == 'refs/heads/main' }}
    outputs:
      version: ${{ steps.meta.outputs.version }}
      base_version: ${{ steps.meta.outputs.base_version }}
      ipa_name: ${{ steps.meta.outputs.ipa_name }}
      release_tag: ${{ steps.meta.outputs.release_tag }}
      loc_sha: ${{ steps.meta.outputs.loc_sha }}
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: loc-source
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: loc-source
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.5'
          cache: pnpm
          cache-dependency-path: loc-source/pnpm-lock.yaml
      - name: Validate current version and optional release tag
        id: meta
        shell: bash
        env:
          REQUESTED_RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+-rc\.[0-9]+(\.[0-9]+)*$ ]]; then
            echo "::error::The iOS RC workflow requires a valid package RC version."
            exit 1
          fi
          test "$(node -p "require('./package.json').packageManager")" = 'pnpm@10.30.3'
          test -s pnpm-lock.yaml
          if [[ -n "$REQUESTED_RELEASE_TAG" && "$REQUESTED_RELEASE_TAG" != "v$version" ]]; then
            echo "::error::Requested tag does not match package version."
            exit 1
          fi
          printf '%s\n' \
            "version=$version" \
            "base_version=${version%%-*}" \
            "ipa_name=LOC-$version-device-unsigned.ipa" \
            "release_tag=$REQUESTED_RELEASE_TAG" \
            "loc_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - run: pnpm install --frozen-lockfile
      - name: Parse JavaScript and JSX before paying for the macOS build
        run: pnpm run check:syntax

  build-device-ipa:
    needs: guard
    runs-on: macos-26-intel
    defaults:
      run:
        working-directory: loc-source
    timeout-minutes: 60
    env:
      LOC_VERSION: ${{ needs.guard.outputs.version }}
      LOC_BASE_VERSION: ${{ needs.guard.outputs.base_version }}
      LOC_IPA_NAME: ${{ needs.guard.outputs.ipa_name }}
      LOC_RELEASE_TAG: ${{ needs.guard.outputs.release_tag }}
      LOC_BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - name: Checkout pinned LOC source for existing IPA flow
        uses: actions/checkout@v4
        with:
          repository: EsotericVerse/lunacodex
          ref: ${{ needs.guard.outputs.loc_sha }}
          path: loc-source
          persist-credentials: false
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.30.3
          run_install: false
      - name: Install Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22.23.5'
          cache: pnpm
          cache-dependency-path: loc-source/pnpm-lock.yaml
      - name: Verify native build tools
        run: |
          xcodebuild -version
          xcrun --find swift
      - name: Install dependency lockfile
        run: pnpm install --frozen-lockfile
      - name: Install pinned Capacitor CLI in isolated native toolchain
        run: |
          mkdir -p "$RUNNER_TEMP/loc-capacitor-cli"
          printf '{"name":"loc-native-cli","private":true,"version":"0.0.0"}\n' > "$RUNNER_TEMP/loc-capacitor-cli/package.json"
          pnpm --dir "$RUNNER_TEMP/loc-capacitor-cli" add --save-exact "@capacitor/cli@8.5.3"
          test -x "$RUNNER_TEMP/loc-capacitor-cli/node_modules/.bin/cap"
      - name: Build LOC static export for the existing native shell
        env:
          NEXT_PUBLIC_LOC_NATIVE_BUNDLE: '1'
        run: |
          pnpm run build:static
          test -f out/index.html
      - name: Generate ephemeral iOS project and sync
        run: |
          "$RUNNER_TEMP/loc-capacitor-cli/node_modules/.bin/cap" add ios
          "$RUNNER_TEMP/loc-capacitor-cli/node_modules/.bin/cap" sync ios
          test -f ios/App/App.xcodeproj/project.pbxproj
      - name: Install approved native LOC launcher icon
        run: |
          set -euo pipefail
          source_icon="assets/site/icons/loc-app-emblem.png"
          target_icon="ios/App/App/Assets.xcassets/AppIcon.appiconset/AppIcon-512@2x.png"
          test -s "$source_icon"
          test -f ios/App/App/Assets.xcassets/AppIcon.appiconset/Contents.json
          swift scripts/prepare-ios-app-icon.swift "$source_icon" "$target_icon"
          test -s "$target_icon"
          /usr/bin/sips -g pixelWidth -g pixelHeight "$target_icon" | grep -q '1024'
      - name: Resolve Swift packages
        run: xcodebuild -resolvePackageDependencies -project ios/App/App.xcodeproj -scheme App
      - name: Compile unsigned physical-device application
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/loc-ios-device-build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            MARKETING_VERSION="$LOC_BASE_VERSION" \
            CURRENT_PROJECT_VERSION="$LOC_BUILD_NUMBER" \
            build
      - name: Package and verify unsigned IPA
        shell: bash
        run: |
          set -euo pipefail
          app="$RUNNER_TEMP/loc-ios-device-build/Build/Products/Debug-iphoneos/App.app"
          test -d "$app"
          test -f "$app/Info.plist"
          test -f "$app/App"
          test -f "$app/public/index.html"
          test -s "$app/Assets.car"
          version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Info.plist")
          build=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$app/Info.plist")
          icon=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIcons:CFBundlePrimaryIcon:CFBundleIconName' "$app/Info.plist")
          test "$version" = "$LOC_BASE_VERSION"
          test "$build" = "$LOC_BUILD_NUMBER"
          test "$icon" = 'AppIcon'
          xcrun lipo -archs "$app/App" | tr ' ' '\n' | grep -qx arm64
          bundle=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Info.plist")
          test "$bundle" = "cc.lo3rwang.loc.mobile"
          stage="$RUNNER_TEMP/loc-ios-package"
          mkdir -p "$stage/Payload" "$PWD/dist"
          ditto "$app" "$stage/Payload/App.app"
          (cd "$stage" && zip -qry "$GITHUB_WORKSPACE/loc-source/dist/$LOC_IPA_NAME" Payload)
          unzip -t "$PWD/dist/$LOC_IPA_NAME" | tail -1
          python3 - <<'PY'
          from zipfile import ZipFile
          import os
          with ZipFile('dist/'+os.environ['LOC_IPA_NAME']) as archive:
              paths=archive.namelist()
              assert all(name.isascii() for name in paths), 'Unicode filenames remain inside IPA'
              print('LOC IPA verified: ASCII-only paths; no LRS cards required')
          PY
          test -s "$PWD/dist/$LOC_IPA_NAME"
          echo "Unsigned IPA generated. It must be signed on the user's machine; this CI artifact is NOT directly installable."
      - name: Upload unsigned IPA artifact
        id: ipa_upload
        uses: actions/upload-artifact@v4
        with:
          name: LOC-${{ needs.guard.outputs.version }}-${{ github.run_number }}-unsigned
          path: loc-source/dist/${{ needs.guard.outputs.ipa_name }}
          retention-days: 14
          if-no-files-found: error
      - name: Attach unsigned IPA to the matching RC prerelease
        if: ${{ needs.guard.outputs.release_tag != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$LOC_RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null ||
            { echo "::error::The requested LOC release does not exist; unsigned Actions artifact is retained."; exit 1; }
          gh release upload "$LOC_RELEASE_TAG" "dist/$LOC_IPA_NAME" --repo "$GITHUB_REPOSITORY"
      - name: Publish build summary and artifact link
        env:
          ARTIFACT_URL: ${{ steps.ipa_upload.outputs.artifact-url }}
        run: |
          {
            echo "## LOC $LOC_VERSION iOS device test build (unsigned)"
            echo "- LOC source commit: \`$(git rev-parse HEAD)\`"
            echo "- Commit: \`$GITHUB_SHA\`"
            echo "- [Download IPA Artifact]($ARTIFACT_URL)"
            echo '- IPA is unsigned; Apple signing is required before device installation.'
            echo '- CI validates packaging, not native iPhone tap/navigation behavior.'
          } >> "$GITHUB_STEP_SUMMARY"

