name: LOC iOS Device Unsigned IPA
run-name: LOC iOS IPA · ${{ github.ref_name }} · ${{ github.sha }}

# Manual only: no new IPA until requested by the owner.
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Attach unsigned IPA to the matching current RC prerelease (optional)'
        required: false
        type: string

permissions:
  contents: write

# Keep only the newest main build when several app commits land together.
concurrency:
  group: loc-ios-device-main
  cancel-in-progress: true

jobs:
  # Cheap, fast, deterministic gate on a normal Linux runner: catches an
  # obviously broken commit before any minute is spent on the much more
  # expensive macOS runner below. It validates syntax once without
  # repeating standalone regression test suites. If this guard passes,
  # the native build proceeds; it never blocks on anything other than a
  # real syntax break, so it can't get stuck or loop.
  guard:
    if: ${{ github.ref == 'refs/heads/main' }}
    outputs:
      version: ${{ steps.meta.outputs.version }}
      base_version: ${{ steps.meta.outputs.base_version }}
      ipa_name: ${{ steps.meta.outputs.ipa_name }}
      release_tag: ${{ steps.meta.outputs.release_tag }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
          cache: npm
      - name: Validate current version and optional release tag
        id: meta
        shell: bash
        env:
          REQUESTED_RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+-rc\.[0-9]+(\.[0-9]+)*$ ]]; then
            echo "::error::The iOS RC workflow requires a valid package RC version."
            exit 1
          fi
          test "$(node -p "require('./package-lock.json').version")" = "$version"
          test "$(node -p "require('./package-lock.json').packages[''].version")" = "$version"
          if [[ -n "$REQUESTED_RELEASE_TAG" && "$REQUESTED_RELEASE_TAG" != "v$version" ]]; then
            echo "::error::Requested tag does not match package version."
            exit 1
          fi
          printf 'version=%s\nbase_version=%s\nipa_name=%s\nrelease_tag=%s\n' \
            "$version" "${version%%-*}" "LOC-$version-device-unsigned.ipa" "$REQUESTED_RELEASE_TAG" >> "$GITHUB_OUTPUT"
      - run: npm ci --no-audit --no-fund
      - name: Parse JavaScript and JSX before paying for the macOS build
        run: npm run check:syntax

  build-device-ipa:
    needs: guard
    runs-on: macos-26-intel
    timeout-minutes: 60
    env:
      LOC_VERSION: ${{ needs.guard.outputs.version }}
      LOC_BASE_VERSION: ${{ needs.guard.outputs.base_version }}
      LOC_IPA_NAME: ${{ needs.guard.outputs.ipa_name }}
      LOC_RELEASE_TAG: ${{ needs.guard.outputs.release_tag }}
      LOC_BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - name: Checkout LOC
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
          cache: npm
      - name: Verify native build tools
        run: |
          xcodebuild -version
          xcrun --find swift
      - name: Install dependency lockfile
        run: npm ci --no-audit --no-fund
      - name: Install pinned Capacitor CLI in isolated native toolchain
        run: |
          npm install --prefix "$RUNNER_TEMP/loc-capacitor-cli" --no-save --no-package-lock --no-audit --no-fund "@capacitor/cli@8.5.3"
          test -x "$RUNNER_TEMP/loc-capacitor-cli/node_modules/.bin/cap"
      - name: Build LOC static export for the native shell
        run: |
          npm run build:static
          test -f out/index.html
      - name: Check Guest and Admin static route exports
        run: node scripts/verify-release-static-export.mjs
      - name: Verify numeric source Rune card files (never rewrite)
        run: python3 scripts/prepare-ios-static-assets.py out
      - name: Generate ephemeral iOS project and sync
        run: |
          "$RUNNER_TEMP/loc-capacitor-cli/node_modules/.bin/cap" add ios
          "$RUNNER_TEMP/loc-capacitor-cli/node_modules/.bin/cap" sync ios
          test -f ios/App/App.xcodeproj/project.pbxproj
      - name: Install approved native LOC launcher icon
        run: |
          set -euo pipefail
          source_icon="assets/site/icons/loc-app-emblem.png"
          target_icon="ios/App/App/Assets.xcassets/AppIcon.appiconset/AppIcon-512@2x.png"
          test -s "$source_icon"
          test -f ios/App/App/Assets.xcassets/AppIcon.appiconset/Contents.json
          swift scripts/prepare-ios-app-icon.swift "$source_icon" "$target_icon"
          test -s "$target_icon"
          /usr/bin/sips -g pixelWidth -g pixelHeight "$target_icon" | grep -q '1024'
      - name: Resolve Swift packages
        run: xcodebuild -resolvePackageDependencies -project ios/App/App.xcodeproj -scheme App
      - name: Compile unsigned physical-device application
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/loc-ios-device-build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            MARKETING_VERSION="$LOC_BASE_VERSION" \
            CURRENT_PROJECT_VERSION="$LOC_BUILD_NUMBER" \
            build
      - name: Package and verify unsigned IPA
        shell: bash
        run: |
          set -euo pipefail
          app="$RUNNER_TEMP/loc-ios-device-build/Build/Products/Debug-iphoneos/App.app"
          test -d "$app"
          test -f "$app/Info.plist"
          test -f "$app/App"
          test -f "$app/public/index.html"
          test -s "$app/Assets.car"
          version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Info.plist")
          build=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$app/Info.plist")
          icon=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIcons:CFBundlePrimaryIcon:CFBundleIconName' "$app/Info.plist")
          test "$version" = "$LOC_BASE_VERSION"
          test "$build" = "$LOC_BUILD_NUMBER"
          test "$icon" = 'AppIcon'
          xcrun lipo -archs "$app/App" | tr ' ' '\n' | grep -qx arm64
          bundle=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Info.plist")
          test "$bundle" = "cc.lo3rwang.loc.mobile"
          stage="$RUNNER_TEMP/loc-ios-package"
          mkdir -p "$stage/Payload" "$GITHUB_WORKSPACE/dist"
          ditto "$app" "$stage/Payload/App.app"
          (cd "$stage" && zip -qry "$GITHUB_WORKSPACE/dist/$LOC_IPA_NAME" Payload)
          unzip -t "$GITHUB_WORKSPACE/dist/$LOC_IPA_NAME" | tail -1
          python3 - <<'PY'
          from zipfile import ZipFile
          import os
          with ZipFile('dist/'+os.environ['LOC_IPA_NAME']) as archive:
              paths=archive.namelist()
              assert all(name.isascii() for name in paths), 'Unicode filenames remain inside IPA'
              prefix='Payload/App.app/public/assets/lunarunes/cards/'
              actual={name for name in paths if name.startswith(prefix) and name.endswith('.png')}
              expected={prefix+f'{index:02}.png' for index in range(0,67)}
              assert actual==expected, f'Expected 67 ASCII-named card images, got {len(actual)}'
              print('IPA verified: ASCII-only paths and 67 numeric card images')
          PY
          test -s "$GITHUB_WORKSPACE/dist/$LOC_IPA_NAME"
          echo "Unsigned IPA generated. It must be signed on the user's machine; this CI artifact is NOT directly installable."
      - name: Upload unsigned IPA artifact
        id: ipa_upload
        uses: actions/upload-artifact@v4
        with:
          name: LOC-${{ needs.guard.outputs.version }}-${{ github.run_number }}-unsigned
          path: dist/${{ needs.guard.outputs.ipa_name }}
          retention-days: 14
          if-no-files-found: error
      - name: Attach unsigned IPA to the matching RC prerelease
        if: ${{ needs.guard.outputs.release_tag != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$LOC_RELEASE_TAG" "dist/$LOC_IPA_NAME"
      - name: Publish build summary and artifact link
        env:
          ARTIFACT_URL: ${{ steps.ipa_upload.outputs.artifact-url }}
        run: |
          {
            echo "## LOC $LOC_VERSION iOS device test build (unsigned)"
            echo "- Source branch: \`$GITHUB_REF_NAME\`"
            echo "- Commit: \`$GITHUB_SHA\`"
            echo "- [Download IPA Artifact]($ARTIFACT_URL)"
            echo '- IPA is unsigned; Apple signing is required before device installation.'
            echo '- CI validates packaging, not native iPhone tap/navigation behavior.'
          } >> "$GITHUB_STEP_SUMMARY"
