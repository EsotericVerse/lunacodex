name: Verify Better Auth LOC rewrite
on:
  pull_request:
    paths:
      - 'workers/loc-authority/**'
      - 'app/loc/**'
      - 'functions/**'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/test-loc-auth-rewrite.mjs'
      - '.github/workflows/verify-better-auth-loc.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify JS modules and permission contract
        run: |
          node --check workers/loc-authority/index.mjs
          node --check workers/loc-authority/auth.mjs
          node --check app/loc/mcp/native-operations.mjs
          node --check app/loc/mcp/native-kysely.mjs
          node --check app/loc/providers/configured.mjs
          node --check functions/api/loc-permissions.js
          npm run test:authority
      - name: Bundle Auth Worker without deployment
        run: npx --yes wrangler@4.157.0 deploy --config workers/loc-authority/wrangler.jsonc --dry-run --outdir /tmp/loc-auth-dry
