name: Verify Better Auth LOC rewrite
on:
  workflow_dispatch:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: loc_ci
          POSTGRES_PASSWORD: loc_ci_only
          POSTGRES_DB: loc_auth_schema
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U loc_ci -d loc_auth_schema"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify JS modules and permission contract
        run: |
          node --check workers/loc-authority/index.mjs
          node --check workers/loc-authority/auth.mjs
          node --check app/loc/mcp/native-operations.mjs
          node --check app/loc/mcp/router.mjs
          node --check app/loc/mcp/private-galaxy.mjs
          node --check extensions/loc-galaxy-link/background.js
          node --check app/loc/mcp/native-kysely.mjs
          node --check app/loc/providers/configured.mjs
          node --check functions/api/loc-permissions.js
          npm run test:authority
      - name: Bundle Auth Worker without deployment
        run: npx --yes wrangler@4.157.0 deploy --config workers/loc-authority/wrangler.jsonc --dry-run --outdir /tmp/loc-auth-dry
      - name: Verify LOC website production build and public rendering compilation
        run: |
          npm run check:syntax
          npm run build
      - name: Generate official Better Auth PostgreSQL schema without applying it
        env:
          LOC_AUTH_SCHEMA_GENERATION: '1'
        run: npx --yes auth@1.7.18 generate --config ./scripts/loc-auth.schema-config.mjs --output /tmp/loc-auth-generated.sql --yes
      - name: Save generated SQL for schema-change review
        uses: actions/upload-artifact@v4
        with:
          name: loc-auth-vendor-generated-sql
          path: /tmp/loc-auth-generated.sql
          if-no-files-found: error
