name: Verify LOC uses sole pinned LRS source (no deployment)
on:
  pull_request:
    branches: [main]
    paths:
      - 'config/lrs-source.json'
      - 'scripts/restore-lrs-web-code.mjs'
      - 'scripts/check-lrs-source-ownership.mjs'
      - 'scripts/test-lrs-web-assets.mjs'
      - 'app/lrunes/**'
      - 'app/card/**'
      - 'app/daily/**'
      - 'app/loc/LocApp.jsx'
      - 'app/loc/views/LrsWebRedirect.jsx'
      - 'app/loc/views/LrsPortalView.jsx'
      - 'app/styles/**'
      - 'assets/lunarunes/**'
      - 'public/vendor/effekseer/**'
      - 'package.json'
      - 'next.config.mjs'
      - '.github/workflows/verify-lrs-single-source.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-source-boundary:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.5'
          cache: npm
      - name: Ensure LOC owns no duplicate LRS sources or art
        run: node scripts/check-lrs-source-ownership.mjs
      - name: Install LOC build dependencies without deploying
        run: npm ci --no-audit --no-fund
      - name: Validate Web URL/native file handoff contracts
        run: node --test scripts/test-lrs-web-assets.mjs scripts/test-las-ipa-runes.mjs
      - name: Build LOC static export from exact LRS source SHA
        run: npm run build:static
      - name: Verify all LOC Scope routes and absence of Rune media copies
        run: |
          node scripts/verify-release-static-export.mjs
          test -s out/index.html
          test -s out/lrunes/index.html
          test -s out/daily/log/index.html
          test ! -d out/assets/lunarunes
          test ! -d out/vendor/effekseer
      - name: No Worker deployment or LOC production release from this job
        run: echo 'Build and file validation only; no Cloudflare writes or grants'
