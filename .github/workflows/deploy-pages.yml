name: Deploy Main Next to GitHub Pages

# Owner-approved: publish GitHub Pages automatically when main receives a push.
# The existing concurrency group cancels superseded deployments.
on:
  push:
    branches:
      - main
    # Owner-approved: skip the deploy build when a push to main changes ONLY
    # docs/agent/hook files. GitHub runs the job only if at least one changed
    # path is NOT matched below, so mixed code+docs pushes still deploy.
    paths-ignore:
      - '**/*.md'
      - '*.md'
      - 'AGENTS.md'
      - '.githooks/**'
      - '.agents/**'
      - '.claude/**'
      - 'node_modules/**'
      - '.git/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    # See next-architecture.yml for why this is pinned instead of
    # ubuntu-latest (the same runner-image migration window).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.4"
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      # The full Next.js build below parses source files. An independent
      # full-repository syntax sweep is reserved for interruption recovery
      # via the manual Workflow guard; do not run it on every main push.
      - name: Security release gate (moderate, high and critical)
        run: npm run audit:security
      - name: Game regression tests
        run: npm run test:game
      - name: Build Next static export for GitHub Pages
        # shell: bash enables pipefail; without it `| tee` hides a failed build.
        shell: bash
        run: npm run build:static 2>&1 | tee /tmp/next-build.log
      - name: Check Guest and Admin static route exports
        run: node scripts/verify-release-static-export.mjs
      - name: Report build failure to job summary
        if: failure()
        run: |
          echo '## Build failure output' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          if [ -f /tmp/next-build.log ]; then
            tail -n 200 /tmp/next-build.log >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Build was not started. See the earlier failed test or setup step.' >> "$GITHUB_STEP_SUMMARY"
          fi
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Probe out/ with tar
        if: success()
        run: |
          tar -cf /dev/null --dereference --hard-dereference out 2>/tmp/tar.err; RC=$?
          echo "::notice title=tar-probe::rc=$RC $(head -c 300 /tmp/tar.err | tr '\n' ' ')"
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
