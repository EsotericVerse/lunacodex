
name: Deploy Main Next to GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Manual LOC GitHub Pages fallback only. The normal LOC publisher already
# handles main; auto-publishing both would duplicate full Next.js builds.
# No Cloudflare token, DNS change or Worker grant.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.30.3
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.23.5'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify LOC public service links
        run: node --test scripts/test-loc-service-routes.mjs

      - name: Build static export
        shell: bash
        run: |
          set -o pipefail
          pnpm run build:static 2>&1 | tee /tmp/next-build.log

      - name: Report build failure
        if: failure()
        shell: bash
        run: |
          {
            echo '## Build failure'
            echo '```'
            if [ -f /tmp/next-build.log ]; then
              tail -n 200 /tmp/next-build.log
            else
              echo 'Build did not start or failed before logging.'
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./out

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
