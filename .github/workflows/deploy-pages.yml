
name: Deploy Main Next to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.23.5'
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Security release gate
        run: npm run audit:security

      - name: Build static export
        shell: bash
        run: |
          set -o pipefail
          npm run build:static 2>&1 | tee /tmp/next-build.log

      - name: Verify static export
        run: node scripts/verify-release-static-export.mjs

      - name: Report build failure
        if: failure()
        shell: bash
        run: |
          {
            echo '## Build failure'
            echo '```'
            if [ -f /tmp/next-build.log ]; then
              tail -n 200 /tmp/next-build.log
            else
              echo 'Build did not start or failed before logging.'
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./out

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
