name: Check LOC LAS Business Bridge
on:
  pull_request:
    paths:
      - 'functions/api/las-native.js'
      - 'app/loc/mcp/native-operations.mjs'
      - 'scripts/test-las-native-bridge.mjs'
      - '.github/workflows/check-las-native-bridge.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.5'
      - name: Check syntax and fixed OAuth routing without building Next.js
        run: |
          node --check functions/api/las-native.js
          node --check app/loc/mcp/native-operations.mjs
          node --test scripts/test-las-native-bridge.mjs
