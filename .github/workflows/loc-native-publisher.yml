name: LOC Native Publisher (Opt-in)
on:
  pull_request:
    paths:
      - 'modules/loc/site/**'
      - 'modules/loc/core/**'
      - 'scripts/build-loc-native.mjs'
      - 'public/loc-native-*'
      - 'tests/loc-native-*.test.mjs'
      - '.github/workflows/loc-native-publisher.yml'
  push:
    branches: [main]
    paths:
      - 'modules/loc/site/**'
      - 'scripts/build-loc-native.mjs'
      - 'public/loc-native-*'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  publisher:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.5'
      - name: Test native DOM and SQL core
        run: node --test tests/loc-native-framework.test.mjs tests/loc-native-public-api.test.mjs
      - name: Validate publisher source
        run: |
          node --check scripts/build-loc-native.mjs
          node --check public/loc-native-client.mjs
          node --check modules/loc/site/index.mjs
      - name: Build opt-in LOC HTML without npm install
        run: node scripts/build-loc-native.mjs
      - name: Verify LOC-owned native routes without LRS routing
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const report=JSON.parse(fs.readFileSync('out/_loc/native-report.json','utf8'));
          assert.equal(report.framework,'LOC');
          assert.equal(report.routes,22);
          assert.deepEqual(report.clientFrameworks,[]);
          for(const file of ['out/index.html','out/lo3rwang/index.html',
            'out/lrunes/index.html','out/work/index.html','out/loc-native-client.mjs',
            'out/_loc/core/index.mjs','out/pics/LOC-2.png']){
            assert.ok(fs.statSync(file).size>0,file);
          }
          assert.equal(fs.existsSync('out/_redirects'),false);
          for(const route of ['card','card/daily','card/duel','card/list',
              'daily','daily/log','daily/trend','game','game/room']){
            assert.equal(fs.existsSync('out/'+route+'/index.html'),false,route);
          }
          assert.equal(fs.existsSync('out/_loc/routes'),false);
          assert.equal(fs.existsSync('out/sw.js'),false);
          NODE
