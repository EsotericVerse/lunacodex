name: Publish LOC Release Candidate
run-name: Publish LOC RC from ${{ github.ref_name }} · ${{ github.sha }}

# Explicitly manual only. Cloudflare Pages separately deploys main.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: loc-release-candidate
  cancel-in-progress: false

jobs:
  publish-rc:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout main at the requested commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate version and lockfile
        id: release
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/main'
          version="$(node -p "require('./package.json').version")"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+-rc\.[0-9]+(\.[0-9]+)*$ ]]; then
            echo "::error::Refusing to publish a non-RC version: $version"
            exit 1
          fi
          test "$(node -p "require('./package-lock.json').version")" = "$version"
          test "$(node -p "require('./package-lock.json').packages[''].version")" = "$version"
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
      - name: Publish a new GitHub prerelease and immutable tag target
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          LOC_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          tag="v$LOC_VERSION"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "::error::Release $tag already exists. Never silently overwrite a published RC."
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "::error::Tag $tag already exists. Inspect it before publishing."
            exit 1
          fi
          gh release create "$tag" \
            --target "$GITHUB_SHA" \
            --title "LOC $LOC_VERSION — Release Candidate" \
            --notes "LOC release candidate. Internal release notes: galaxy:55970CD5 (authorized LOC MCP only)." \
            --prerelease
          gh release view "$tag" --json name,tagName,isPrerelease,htmlUrl
