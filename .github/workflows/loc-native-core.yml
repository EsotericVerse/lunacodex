name: LOC Native Framework

on:
  pull_request:
    paths:
      - 'modules/loc/**'
      - 'scripts/build-loc-native.mjs'
      - 'public/loc-native-*'
      - 'functions/api/loc-framework.js'
      - 'package.json'
      - 'package-lock.json'
      - 'tests/loc-native-framework.test.mjs'
      - '.github/workflows/loc-native-core.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.5'
          cache: npm
      - name: Test LOC native core without installing UI frameworks
        run: node --test tests/loc-native-framework.test.mjs
      - name: Validate native client and publisher syntax
        run: |
          node --check public/loc-native-client.mjs
          node --check scripts/build-loc-native.mjs
          node --check functions/api/loc-framework.js
      - name: Build standalone LOC HTML without npm install
        run: |
          node scripts/build-loc-native.mjs
          test -s out/index.html
          test -s out/_loc/core/index.mjs
          node -e 'const x=require("./out/_loc/native-report.json");if(x.mapProvider||x.clientFrameworks.length)process.exit(1)'
      - name: Install current extension and server drivers
        run: npm ci --no-audit --no-fund
      - name: Verify minimal dependency graph
        run: |
          npm ls --depth=0
          test ! -d node_modules/react
          test ! -d node_modules/preact
          test ! -d node_modules/esbuild
          test ! -d node_modules/kysely
          test ! -d node_modules/@zenstackhq
          test ! -d node_modules/@blocknote
          test ! -d node_modules/recharts
          test ! -d node_modules/vis-timeline
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const root=JSON.parse(fs.readFileSync('package.json'));
          const lock=JSON.parse(fs.readFileSync('package-lock.json'));
          assert.equal(Object.keys(root.dependencies).length,3);
          assert.equal(Object.keys(root.devDependencies).length,1);
          assert.ok(Object.keys(lock.packages).length<50);
          assert.equal(root.scripts.build,'node scripts/build-loc-native.mjs');
          NODE
      - name: Build LOC native HTML website
        run: npm run build
      - name: Verify clean-slate HTML export
        run: |
          test -s out/index.html
          test -s out/lo3rwang/index.html
          test -s out/lrunes/index.html
          test -s out/work/index.html
          test -s out/loc-native-client.mjs
          test -s out/_loc/core/index.mjs
          test -s out/_loc/vendor/maplibre-gl.mjs
          test ! -e out/_loc/routes
          test ! -e out/sw.js
          test ! -e out/extension
          test ! -e out/_loc/routes
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const routes=JSON.parse(fs.readFileSync('out/_routes.json','utf8'));
          assert.deepEqual(routes.include,['/api/loc-framework']);
          assert.deepEqual(routes.exclude,[]);
          assert.ok(!fs.readdirSync('out').includes('sw.js'));
          NODE
          # Preserve the nine historical LRS links without legacy React redirect pages.
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const manifest=fs.readFileSync('out/_redirects','utf8');
          const routes=['/card/','/card/daily/','/card/duel/','/card/list/',
            '/daily/','/daily/log/','/daily/trend/','/game/','/game/room/'];
          for(const route of routes){
            const target='https://lrs.lo3rwang.cc'+route;
            assert.ok(manifest.includes(route+' '+target+' 302'),route+' Pages redirect');
            const file='out/'+route.slice(1)+'index.html';
            assert.ok(fs.existsSync(file),file);
            const page=fs.readFileSync(file,'utf8');
            assert.ok(page.includes('http-equiv="refresh"'),route+' offline redirect');
            assert.ok(page.includes(target),route+' target');
          }
          NODE
          grep -q 'LOC Framework' out/index.html
          node -e 'const x=require("./out/_loc/native-report.json");if(x.routes!==22||x.clientFrameworks.length)process.exit(1);console.log(x)'

      - name: Exercise native HTTP runtime without database secrets
        shell: bash
        run: |
          PORT=8877 node scripts/serve-loc-static.mjs >/tmp/loc-native-http.log 2>&1 &
          pid=$!
          trap 'kill $pid 2>/dev/null || true' EXIT
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          let ready=false;
          for(let i=0;i<30;i++){
            try{
              const response=await fetch('http://127.0.0.1:8877/');
              if(response.ok){ready=true;break;}
            }catch{}
            await new Promise(resolve=>setTimeout(resolve,100));
          }
          assert.ok(ready,'LOC native HTTP server did not start');
          for(const route of ['/','/work/','/culture/','/lo3rwang/','/lrunes/']){
            const response=await fetch('http://127.0.0.1:8877'+route);
            assert.equal(response.status,200,route);
            assert.match(await response.text(),/LOC/);
          }
          const js=await fetch('http://127.0.0.1:8877/loc-native-client.mjs');
          assert.match(js.headers.get('content-type'),/text\/javascript/);
          const invalid=await fetch('http://127.0.0.1:8877/api/loc-framework?scope=unknown');
          assert.equal(invalid.status,400);
          const offline=await fetch('http://127.0.0.1:8877/api/loc-framework?scope=loc');
          assert.equal(offline.status,503);
          console.log('LOC native static, ESM, routing and API guards passed');
          NODE
