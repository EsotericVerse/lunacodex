name: LOC Next React and SQL Transaction Regression

on:
  pull_request:
    paths:
      - 'app/**'
      - 'functions/**'
      - 'modules/loc/dialect/**'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/**'
      - 'tests/**'
      - 'next.config.mjs'
      - '.github/workflows/loc-next-transaction-regression.yml'
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'functions/**'
      - 'modules/loc/dialect/**'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/**'
      - 'tests/**'
      - 'next.config.mjs'
      - '.github/workflows/loc-next-transaction-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: loc-next-txn-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  next-react-transaction:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.5'
          cache: npm
      # Temporary metadata capture for reproducible npm lock regeneration;
      # this step will be removed after committing the generated lock.
      - name: Generate reviewed Ariakit lock diff
        shell: bash
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import {execFileSync} from 'node:child_process';
          const before=JSON.parse(execFileSync('git',['show','HEAD:package-lock.json'],
            {encoding:'utf8'}));
          const after=JSON.parse(fs.readFileSync('package-lock.json','utf8'));
          const changed=Object.fromEntries(Object.entries(after.packages).filter(
            ([name,pkg])=>JSON.stringify(pkg)!==JSON.stringify(before.packages[name])));
          const removed=Object.keys(before.packages).filter(
            name=>!Object.hasOwn(after.packages,name));
          const data=Buffer.from(JSON.stringify({changed,removed})).toString('base64');
          console.log('LOC_ARIAKIT_LOCK_DIFF_BEGIN');
          for(let index=0;index<data.length;index+=400)
            console.log('LOCKDIFF:'+data.slice(index,index+400));
          console.log('LOC_ARIAKIT_LOCK_DIFF_END');
          NODE
      - name: Install exact Next and React build dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify transaction and interactive frontend regressions
        run: |
          npm run check:syntax
          node --test tests/*.test.mjs
      - name: Build Next static export once
        run: npm run build:static
      - name: Verify real Next export and core routes
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          for(const file of [
            'out/index.html','out/culture/index.html','out/statics/index.html',
            'out/trace/index.html','out/search/index.html',
            'out/lo3rwang/index.html','out/lrunes/index.html'
          ]){
            const html=fs.readFileSync(file,'utf8');
            assert.match(html,/<html/);
            assert.ok(html.includes('/_next/static/'),file+' missing Next client bundles');
          }
          assert.equal(fs.existsSync('out/_loc/routes'),false);
          NODE
