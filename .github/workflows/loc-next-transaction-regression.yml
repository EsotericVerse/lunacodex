name: LOC Next React and SQL Transaction Regression

on:
  pull_request:
    paths:
      - 'app/**'
      - 'modules/loc/dialect/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'scripts/**'
      - 'tests/**'
      - 'next.config.mjs'
      - '.github/workflows/loc-next-transaction-regression.yml'
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'modules/loc/dialect/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'scripts/**'
      - 'tests/**'
      - 'next.config.mjs'
      - '.github/workflows/loc-next-transaction-regression.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: loc-next-txn-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  next-react-transaction:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Identify exact checked-out source tree
        id: source
        run: echo "tree=$(git rev-parse 'HEAD^{tree}')" >> "$GITHUB_OUTPUT"
      - name: Reuse successful PR verification for identical main tree
        id: reuse
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_TREE: ${{ steps.source.outputs.tree }}
        shell: bash
        run: |
          # The PR checkout is the actual merge tree, not merely its head SHA.
          # A matching successful receipt is required; any API error means test again.
          echo "skip=false" >> "$GITHUB_OUTPUT"
          endpoint="repos/$GITHUB_REPOSITORY/actions/workflows/loc-next-transaction-regression.yml/runs"
          if ! runs=$(timeout 15s gh api "$endpoint?event=pull_request&status=success&per_page=10" --jq '[.workflow_runs[] | select(.head_repository.full_name == .repository.full_name) | .id] | .[]'); then
            echo "Prior verification unavailable; running tests."
            exit 0
          fi
          for id in $runs; do
            [[ "$id" =~ ^[0-9]+$ ]] || continue
            if ! jobs=$(timeout 10s gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id/jobs?filter=latest&per_page=50"); then
              continue
            fi
            if jq -e --arg marker "Verified tree $SOURCE_TREE" '
              any(.jobs[]; .name == "next-react-transaction" and .conclusion == "success"
                and any(.steps[]; .name == $marker and .conclusion == "success")
                and any(.steps[]; .name == "Verify transaction and interactive frontend regressions" and .conclusion == "success")
                and any(.steps[]; .name == "Verify live React development console without missing-key warnings" and .conclusion == "success"))
            ' <<< "$jobs" > /dev/null; then
              echo "skip=true" >> "$GITHUB_OUTPUT"
              echo "Reusing successful PR run $id for identical source tree $SOURCE_TREE."
              exit 0
            fi
          done
          echo "No identical verified tree found; running tests."
      - uses: pnpm/action-setup@v6
        if: steps.reuse.outputs.skip != 'true'
        with:
          version: 10.30.3
          run_install: false
      - uses: actions/setup-node@v5
        if: steps.reuse.outputs.skip != 'true'
        with:
          node-version: '22.23.5'
          cache: pnpm
      - name: Install exact Next and React build dependencies
        if: steps.reuse.outputs.skip != 'true'
        run: pnpm install --frozen-lockfile
      - name: Verify transaction and interactive frontend regressions
        if: steps.reuse.outputs.skip != 'true'
        run: |
          pnpm run check:syntax
          node --test tests/*.test.mjs
      # Production and preview builds belong to Cloudflare Workers Builds.

      - name: Verify live React development console without missing-key warnings
        # Run even if a separate SQL/Culture regression failed; never mask a React warning.
        if: ${{ !cancelled() && steps.reuse.outputs.skip != 'true' }}
        timeout-minutes: 5
        run: node scripts/check-home-react-dev-console.mjs
      - name: Verified tree ${{ steps.source.outputs.tree }}
        if: ${{ success() && github.event_name == 'pull_request' }}
        run: echo "Regression and browser checks passed for the exact PR checkout."
