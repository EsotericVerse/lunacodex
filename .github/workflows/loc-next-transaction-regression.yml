name: LOC Next React and SQL Transaction Regression

on:
  pull_request:
    paths:
      - 'app/**'
      - 'modules/loc/dialect/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'scripts/**'
      - 'tests/**'
      - 'next.config.mjs'
      - '.github/workflows/loc-next-transaction-regression.yml'
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'modules/loc/dialect/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'scripts/**'
      - 'tests/**'
      - 'next.config.mjs'
      - '.github/workflows/loc-next-transaction-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: loc-next-txn-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  next-react-transaction:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
        with:
          version: 10.30.3
          run_install: false
      - uses: actions/setup-node@v5
        with:
          node-version: '22.23.5'
          cache: pnpm
      - name: Install exact Next and React build dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify transaction and interactive frontend regressions
        run: |
          pnpm run check:syntax
          node --test tests/*.test.mjs
      - name: Build Next.js
        run: pnpm run build

      - name: Verify live React development console without missing-key warnings
        # Run even if a separate SQL/Culture regression failed; never mask a React warning.
        if: ${{ !cancelled() }}
        timeout-minutes: 5
        run: node scripts/check-home-react-dev-console.mjs
