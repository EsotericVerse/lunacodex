name: LOC PR 1806 One-Time Syntax and Static Build
on:
  push:
    branches:
      - fix/loc-home-static-first-load-20261119
permissions:
  contents: read
concurrency:
  group: loc-pr-1806-validate
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.5
          cache: npm
      - name: Install exact dependencies
        run: npm ci --no-audit --no-fund
      - name: Check JavaScript and JSX syntax
        run: npm run check:syntax
      - name: Build LOC static export (no deployment)
        run: npm run build:static
