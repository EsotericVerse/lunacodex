name: LOC Windows React development console

on:
  pull_request:
    paths:
      - 'app/loc/blocks/**'
      - 'app/loc/views/**'
      - 'app/AppShell.jsx'
      - 'public/sw.js'
      - 'tests/loc-sw-cache-retirement.test.mjs'
      - 'scripts/check-home-react-dev-console.mjs'
      - '.github/workflows/loc-windows-react-console.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-home-react-console:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
        with:
          version: 10.30.3
          run_install: false
      - uses: actions/setup-node@v5
        with:
          node-version: '22.17.1'
          cache: pnpm
      - name: Install LOC dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify full five-block homepage in Windows development Chromium
        run: node scripts/check-home-react-dev-console.mjs
